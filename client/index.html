<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARCHGUARD AI — Software Architecture Drift & Governance Platform</title>
    <meta name="description" content="ARCHGUARD AI: Enterprise platform for software architecture drift detection, dependency graph recovery, health scoring, and AI refactoring recommendations." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #050811;
        color: #f8fafc;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        min-height: 100%;
        width: 100%;
      }
      .archguard-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #050811;
        z-index: 9999;
      }
      .preloader-shield {
        font-size: 3.5rem;
        margin-bottom: 16px;
        animation: preloaderPulse 1.6s ease-in-out infinite;
      }
      .preloader-title {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #38bdf8;
      }
      .preloader-sub {
        font-size: 0.82rem;
        color: #94a3b8;
        margin-top: 6px;
      }
      @keyframes preloaderPulse {
        0%, 100% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="archguard-preloader">
        <div class="preloader-shield">🛡️</div>
        <div class="preloader-title">ARCHGUARD<span style="color:#818cf8;">.AI</span></div>
        <div class="preloader-sub">Loading architecture governance engine...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
